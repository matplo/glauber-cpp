[build-system]
requires = ["scikit-build-core>=1.1,<2"]
build-backend = "scikit_build_core.build"

[project]
name = "hepyy-glauber-cpp"
version = "0.1.0"
description = "Standalone Monte Carlo Glauber CLI for Pb–Pb collision geometry"
readme = "README.md"
requires-python = ">=3.9"

[project.urls]
Repository = "https://github.com/matplo/glauber-cpp"
Documentation = "https://matplo.github.io/glauber-cpp/"

[tool.scikit-build]
wheel.py-api = "py3"
wheel.packages = []
